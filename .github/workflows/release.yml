name: Build distributions

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}
        run: |
          mkdir -p dist
          binary="pageferry-${GOOS}-${GOARCH}"
          if [ "$GOOS" = windows ]; then binary="${binary}.exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION#v}" -o "dist/${binary}" ./cmd/pageferry
          cd dist
          cp ../LICENSE ../THIRD_PARTY_NOTICES.md .
          if [ "$GOOS" = windows ]; then
            zip "pageferry-${GOOS}-${GOARCH}.zip" "$binary" LICENSE THIRD_PARTY_NOTICES.md
          else
            tar -czf "pageferry-${GOOS}-${GOARCH}.tar.gz" "$binary" LICENSE THIRD_PARTY_NOTICES.md
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: pageferry-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/pageferry-*.tar.gz
            dist/pageferry-*.zip
            dist/pageferry-windows-*.exe
          if-no-files-found: error

  windows-installer:
    needs: test
    strategy:
      matrix:
        include:
          - { goarch: amd64, wix_arch: x64 }
          - { goarch: arm64, wix_arch: arm64 }
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build Windows executable
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = $env:VERSION.TrimStart('v')
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o dist/pageferry.exe ./cmd/pageferry
      - name: Build MSI installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:RELEASE_TAG.TrimStart('v')
            if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)') {
              throw "Release tag must start with a semantic version such as v1.2.3."
            }
            $msiVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          } else {
            $msiVersion = "0.0.$env:GITHUB_RUN_NUMBER"
          }
          $ErrorActionPreference = "Stop"
          dotnet tool install --global wix --version 7.0.0
          if ($LASTEXITCODE -ne 0) { throw "Failed to install WiX tool." }
          $binaryPath = (Resolve-Path "dist/pageferry.exe").Path
          wix build `
            -acceptEula wix7 `
            -arch "${{ matrix.wix_arch }}" `
            -d "Version=$msiVersion" `
            -d "BinaryPath=$binaryPath" `
            -d "LicensePath=$((Resolve-Path 'LICENSE').Path)" `
            -d "NoticesPath=$((Resolve-Path 'THIRD_PARTY_NOTICES.md').Path)" `
            -o "dist/pageferry-windows-${{ matrix.goarch }}.msi" `
            packaging/windows/Package.wxs
          if ($LASTEXITCODE -ne 0) { throw "WiX build failed with exit code $LASTEXITCODE." }
      - uses: actions/upload-artifact@v5
        with:
          name: pageferry-msi-${{ matrix.goarch }}
          path: dist/pageferry-windows-${{ matrix.goarch }}.msi
          if-no-files-found: error

  release:
    needs: [build, windows-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: pageferry-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum pageferry-* > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
